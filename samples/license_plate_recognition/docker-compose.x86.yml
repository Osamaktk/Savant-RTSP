services:
  video-loop-source:
    image: ghcr.io/insight-platform/savant-adapters-gstreamer:latest
    restart: unless-stopped
    volumes:
      - zmq_sockets:/tmp/zmq-sockets
    environment:
      - ZMQ_ENDPOINT=dealer+connect:ipc:///tmp/zmq-sockets/input-video.ipc
      # Configure 10 RTSP input streams
      - LOCATION_0=rtsp://camera1:554/stream
      - LOCATION_1=rtsp://camera2:554/stream
      - LOCATION_2=rtsp://camera3:554/stream
      - LOCATION_3=rtsp://camera4:554/stream
      - LOCATION_4=rtsp://camera5:554/stream
      - LOCATION_5=rtsp://camera6:554/stream
      - LOCATION_6=rtsp://camera7:554/stream
      - LOCATION_7=rtsp://camera8:554/stream
      - LOCATION_8=rtsp://camera9:554/stream
      - LOCATION_9=rtsp://camera10:554/stream
      - SOURCE_ID=video
      - SYNC_OUTPUT=False
    entrypoint: /opt/savant/adapters/gst/sources/multistream.sh
    depends_on:
      module:
        condition: service_healthy

  module:
    image: ghcr.io/insight-platform/savant-deepstream:latest
    restart: unless-stopped
    volumes:
      - zmq_sockets:/tmp/zmq-sockets
      - ../../cache:/cache
      - ..:/opt/savant/samples
    command: samples/license_plate_recognition/module.yml
    environment:
      - MODEL_PATH=/cache/models/license_plate_recognition
      - DOWNLOAD_PATH=/cache/downloads/license_plate_recognition
      - ZMQ_SRC_ENDPOINT=router+bind:ipc:///tmp/zmq-sockets/input-video.ipc
      - ZMQ_SINK_ENDPOINT=pub+bind:ipc:///tmp/zmq-sockets/output-video.ipc
      - METRICS_FRAME_PERIOD=1000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  always-on-sink:
    image: ghcr.io/insight-platform/savant-adapters-deepstream:latest
    restart: unless-stopped
    ports:
      - "554:554"    # RTSP
      - "1935:1935"  # RTMP
      - "888:888"    # HLS
      - "8889:8889"  # WebRTC
    volumes:
      - zmq_sockets:/tmp/zmq-sockets
      - ../assets/stub_imgs:/stub_imgs
    environment:
      - ZMQ_ENDPOINT=sub+connect:ipc:///tmp/zmq-sockets/output-video.ipc
      - SOURCE_ID=video
      - STUB_FILE_LOCATION=/stub_imgs/smpte100_1920x1080.jpeg
      - DEV_MODE=True
      - RTSP_LATENCY_MS=500
      - ENCODER_PROFILE=High
      - ENCODER_BITRATE=8000000
      - FRAMERATE=30/1
    command: python -m adapters.ds.sinks.always_on_rtsp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

volumes:
  zmq_sockets: